<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-container">
    <header>
      <h1>Todo List</h1>
      <div class="week-navigator">
        <button id="prev-week-btn" class="nav-btn">&lt; 이전 주</button>
        <span id="current-month-display">2026년 05월</span>
        <button id="next-week-btn" class="nav-btn">다음 주 &gt;</button>
      </div>
      
      <div id="weekly-calendar" class="weekly-calendar">
        </div>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요..." autocomplete="off">
      <button type="submit" id="add-btn">추가</button>
    </form>

    <div class="filter-container">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행 중</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <ul id="todo-list">
      </ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
